name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (Pint, Larastan, Pest, composer audit)
    runs-on: ubuntu-latest

    env:
      # Banco real (Postgres), não SQLite — paridade com produção. Chaves abaixo são
      # só para teste, já documentadas como tal em backend/phpunit.xml; nunca usadas fora
      # de CI/testing.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lar_analia_franco_test
      DB_USERNAME: lar
      DB_PASSWORD: lar
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FIELD_ENCRYPTION_KEY: base64:2CXDHL3fMP8mbXCe5JRiUEImexTHkhQ3hzgPvQif5V0=
      BLIND_INDEX_KEY: base64:98GJMoj/GdVN6Z9BlvM7Xyjz5RyAQlZhTDIxMtLSVg8=

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lar_analia_franco_test
          POSTGRES_USER: lar
          POSTGRES_PASSWORD: lar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # 8.5, não 8.3: composer.lock foi resolvido com PHP 8.5 e trava uma dependência em
          # ">= 8.4.1" — descoberto validando o docker-compose (ver README, seção
          # "Divergências"). Mantido em sincronia com docker/php/Dockerfile.
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, intl, exif, gd, bcmath, zip, redis
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Rodar migrations
        run: php artisan migrate --force

      - name: Pest
        run: php artisan test

      - name: composer audit
        run: composer audit

  frontend-admin:
    name: frontend-admin (lint, build, npm audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit

  frontend-site:
    name: frontend-site (build, npm audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-site/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm audit
