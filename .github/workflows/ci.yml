name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (Pint, Larastan, Pest, composer audit)
    runs-on: ubuntu-latest

    env:
      # Banco real (Postgres), não SQLite — nunca mais SQLite em teste nenhum, local ou CI
      # (ver CLAUDE.md, "Armadilhas conhecidas": um bug de LIKE sensível a maiúsculas passou
      # pela suíte inteira sem ser notado enquanto ela rodava em SQLite). Mesmos valores de
      # backend/.env.testing (commitado — ver ali para o resto da configuração de teste, ex.
      # SANCTUM_STATEFUL_DOMAINS) de propósito: phpunit.xml só define APP_ENV=testing, e um
      # <env> de lá nunca sobrescreve uma variável já presente no processo (PHPUnit só seta
      # se a variável ainda não existir) — então os valores abaixo, sendo variável de
      # ambiente do job, já vencem SEMPRE, quer .env.testing exista ou não. Redundante com
      # .env.testing de propósito (mesma config, duas fontes) para as etapas que rodam fora
      # do fluxo de teste (Larastan, Pint) também terem um banco válido para se conectar,
      # sem precisar de --env=testing em cada passo.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lar_analia_franco_test
      DB_USERNAME: lar
      DB_PASSWORD: lar
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FIELD_ENCRYPTION_KEY: base64:2CXDHL3fMP8mbXCe5JRiUEImexTHkhQ3hzgPvQif5V0=
      BLIND_INDEX_KEY: base64:98GJMoj/GdVN6Z9BlvM7Xyjz5RyAQlZhTDIxMtLSVg8=

    services:
      # Versão principal (16) igual à do serviço "postgres" em docker-compose.yml, de
      # propósito — divergir aqui reabriria o mesmo risco que motivou parar de usar SQLite:
      # "verde no CI" deixando de significar "verde contra o banco real".
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lar_analia_franco_test
          POSTGRES_USER: lar
          POSTGRES_PASSWORD: lar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # 8.5, não 8.3: composer.lock foi resolvido com PHP 8.5 e trava uma dependência em
          # ">= 8.4.1" — descoberto validando o docker-compose (ver README, seção
          # "Divergências"). Mantido em sincronia com docker/php/Dockerfile.
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, intl, exif, gd, bcmath, zip, redis
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Rodar migrations
        # --env=testing: mesmo mecanismo usado localmente (ver README) para apontar
        # explicitamente para backend/.env.testing, em vez de depender só da variável de
        # ambiente do job para acertar o banco.
        run: php artisan migrate --env=testing --force

      - name: Pest
        run: php artisan test

      - name: composer audit
        run: composer audit

  frontend-admin:
    name: frontend-admin (lint, build, npm audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit

  frontend-site:
    name: frontend-site (build, npm audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-site/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm audit

  e2e:
    name: e2e (Playwright, pilha completa)
    runs-on: ubuntu-latest

    services:
      # Terceiro banco, só da bateria (ver CLAUDE.md, "Os três bancos"): ela roda
      # migrate:fresh a cada execução, então precisa de um banco onde apagar tudo não custe
      # nada. Mesma versão principal do docker-compose.yml e do job backend, pelo mesmo motivo
      # de sempre: "verde no CI" só significa alguma coisa contra o banco de verdade.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lar_analia_franco_e2e
          POSTGRES_USER: lar
          POSTGRES_PASSWORD: lar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      # A bateria usa Redis para sessão e cache (índices próprios, ver backend/.env.e2e) — é o
      # mesmo arranjo do ambiente real, e é o que faz o limitador de login se comportar aqui
      # como se comporta em produção.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Mesma versão do job backend e de docker/php/Dockerfile.
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, intl, exif, gd, bcmath, zip, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Nenhuma variável de ambiente de banco no job, de propósito: toda a configuração da
      # bateria vem de backend/.env.e2e (commitado, só valores fictícios), carregado porque o
      # playwright.config.ts sobe o Laravel com APP_ENV=e2e. Duplicar aqui reabriria a chance
      # de as duas fontes divergirem em silêncio.
      - name: Instalar dependências do backend
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependências do painel
        working-directory: frontend-admin
        run: npm ci

      - name: Instalar dependências do site
        working-directory: frontend-site
        run: npm ci

      - name: Instalar dependências da bateria
        working-directory: e2e
        run: npm ci

      - name: Cache do navegador do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Instalar o Firefox do Playwright
        working-directory: e2e
        # --with-deps traz as bibliotecas de sistema que o runner não tem por padrão; o
        # postinstall do e2e/package.json já baixa o navegador, mas não essas bibliotecas.
        run: npx playwright install --with-deps firefox

      - name: Bateria de ponta a ponta
        working-directory: e2e
        # O webServer do Playwright sobe API, painel e site (build de produção dos dois
        # frontends) antes dos testes, e o global setup recria o banco — nada disso precisa de
        # passo próprio aqui.
        run: npm run test:e2e

      - name: Publicar trace, capturas e vídeo da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefatos
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
