name: CI

on:
  pull_request:
  # Chamado por .github/workflows/deploy.yml, que é quem roda em push na main: o deploy
  # depende de TODOS os jobs daqui passarem, e um workflow separado não consegue esperar
  # outro. Sem `workflow_call`, a alternativa seria `workflow_run`, que dispara DEPOIS e
  # num contexto onde o commit já não é o mesmo — e que publicaria em cima de um CI vermelho
  # se alguém empurrasse duas vezes seguidas.
  #
  # Não há `push: branches: [main]` aqui de propósito: a main passa pelo deploy.yml, e
  # manter os dois gatilhos faria a suíte inteira rodar duas vezes por push.
  workflow_call:

jobs:
  # Decide o que rodar (ver scripts/ci/detectar-mudancas.sh). Job pulado conta como sucesso
  # para o `resultado` lá embaixo; o pacote publicado continua sendo a release completa.
  mudancas:
    name: Detectar mudanças
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      admin: ${{ steps.filtro.outputs.admin }}
      site: ${{ steps.filtro.outputs.site }}
      e2e: ${{ steps.filtro.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filtro
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/ci/detectar-mudancas.sh

  backend:
    name: backend (Pint, Larastan, Pest)
    runs-on: ubuntu-24.04
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    # Push novo cancela o CI anterior ainda em andamento (a publicação, em deploy.yml, nunca é
    # cancelada). Um grupo por job: jobs da mesma execução não podem cancelar uns aos outros.
    concurrency:
      group: ci-backend-${{ github.ref }}
      cancel-in-progress: true

    env:
      # Banco real (Postgres), não SQLite — nunca mais SQLite em teste nenhum, local ou CI
      # (ver CLAUDE.md, "Armadilhas conhecidas": um bug de LIKE sensível a maiúsculas passou
      # pela suíte inteira sem ser notado enquanto ela rodava em SQLite). Mesmos valores de
      # backend/.env.testing (commitado — ver ali para o resto da configuração de teste, ex.
      # SANCTUM_STATEFUL_DOMAINS) de propósito: phpunit.xml só define APP_ENV=testing, e um
      # <env> de lá nunca sobrescreve uma variável já presente no processo (PHPUnit só seta
      # se a variável ainda não existir) — então os valores abaixo, sendo variável de
      # ambiente do job, já vencem SEMPRE, quer .env.testing exista ou não. Redundante com
      # .env.testing de propósito (mesma config, duas fontes) para as etapas que rodam fora
      # do fluxo de teste (Larastan, Pint) também terem um banco válido para se conectar,
      # sem precisar de --env=testing em cada passo.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: lar_analia_franco_test
      DB_USERNAME: lar
      DB_PASSWORD: lar
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FIELD_ENCRYPTION_KEY: base64:2CXDHL3fMP8mbXCe5JRiUEImexTHkhQ3hzgPvQif5V0=
      BLIND_INDEX_KEY: base64:98GJMoj/GdVN6Z9BlvM7Xyjz5RyAQlZhTDIxMtLSVg8=

    services:
      # Versão principal (16) igual à do serviço "postgres" em docker-compose.yml, de
      # propósito — divergir aqui reabriria o mesmo risco que motivou parar de usar SQLite:
      # "verde no CI" deixando de significar "verde contra o banco real".
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lar_analia_franco_test
          POSTGRES_USER: lar
          POSTGRES_PASSWORD: lar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # 8.5, não 8.3: composer.lock foi resolvido com PHP 8.5 e trava uma dependência em
          # ">= 8.4.1" — descoberto validando o docker-compose (ver README, seção
          # "Divergências"). Mantido em sincronia com docker/php/Dockerfile.
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, intl, exif, gd, bcmath, zip, redis
          coverage: none

      - name: Cache do vendor
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('backend/composer.lock') }}

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Rodar migrations
        # --env=testing: mesmo mecanismo usado localmente (ver README) para apontar
        # explicitamente para backend/.env.testing, em vez de depender só da variável de
        # ambiente do job para acertar o banco.
        run: php artisan migrate --env=testing --force

      - name: Pest
        run: php artisan test

  frontend-admin:
    name: frontend-admin (lint, build)
    runs-on: ubuntu-24.04
    needs: mudancas
    if: needs.mudancas.outputs.admin == 'true'
    concurrency:
      group: ci-admin-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-site:
    name: frontend-site (build)
    runs-on: ubuntu-24.04
    needs: mudancas
    if: needs.mudancas.outputs.site == 'true'
    concurrency:
      group: ci-site-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: frontend-site

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-site/package-lock.json

      - run: npm ci
      - run: npm run build

  e2e:
    name: e2e (Playwright, parte ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    needs: mudancas
    if: needs.mudancas.outputs.e2e == 'true'
    concurrency:
      group: ci-e2e-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    # Duas metades da bateria, cada uma com Postgres, Redis, build e `migrate:fresh` próprios —
    # nenhum estado é compartilhado entre elas, então o motivo do `workers: 1` (um banco só)
    # continua valendo DENTRO de cada job. Nenhum teste é removido ou pulado: --shard
    # reparte os arquivos, e juntas as duas partes rodam todos.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      # Terceiro banco, só da bateria (ver CLAUDE.md, "Os três bancos"): ela roda
      # migrate:fresh a cada execução, então precisa de um banco onde apagar tudo não custe
      # nada. Mesma versão principal do docker-compose.yml e do job backend, pelo mesmo motivo
      # de sempre: "verde no CI" só significa alguma coisa contra o banco de verdade.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lar_analia_franco_e2e
          POSTGRES_USER: lar
          POSTGRES_PASSWORD: lar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      # A bateria usa Redis para sessão e cache (índices próprios, ver backend/.env.e2e) — é o
      # mesmo arranjo do ambiente real, e é o que faz o limitador de login se comportar aqui
      # como se comporta em produção.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # Mesma versão do job backend e de docker/php/Dockerfile.
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, mbstring, intl, exif, gd, bcmath, zip, redis
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend-admin/package-lock.json
            frontend-site/package-lock.json
            e2e/package-lock.json

      - name: Cache do vendor
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('backend/composer.lock') }}

      # Versão lida do lock ANTES do `npm ci`: o postinstall do e2e baixa o Firefox, e com o
      # cache já restaurado ele não tem o que baixar.
      - name: Versão do Playwright
        id: playwright
        working-directory: e2e
        run: echo "versao=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache do navegador do Playwright
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-firefox

      # Nenhuma variável de ambiente de banco no job, de propósito: toda a configuração da
      # bateria vem de backend/.env.e2e (commitado, só valores fictícios), carregado porque o
      # playwright.config.ts sobe o Laravel com APP_ENV=e2e. Duplicar aqui reabriria a chance
      # de as duas fontes divergirem em silêncio.
      - name: Instalar dependências do backend
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependências do painel
        working-directory: frontend-admin
        run: npm ci

      - name: Instalar dependências do site
        working-directory: frontend-site
        run: npm ci

      - name: Instalar dependências da bateria
        working-directory: e2e
        run: npm ci

      # Só o Firefox: é o único navegador da bateria. Com o cache, o binário já está em
      # ~/.cache/ms-playwright e só faltam as bibliotecas de sistema (apt, fora do cache).
      - name: Instalar o Firefox do Playwright
        working-directory: e2e
        run: |
          if [ '${{ steps.cache-playwright.outputs.cache-hit }}' = 'true' ]; then
            npx playwright install-deps firefox
          else
            npx playwright install --with-deps firefox
          fi

      - name: Bateria de ponta a ponta
        working-directory: e2e
        # O webServer do Playwright sobe API, painel e site (build de produção dos dois
        # frontends) antes dos testes, e o global setup recria o banco — nada disso precisa de
        # passo próprio aqui.
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Publicar trace, capturas e vídeo da falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artefatos-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  # Ponto único que o deploy consulta. Job pulado (por não haver mudança) conta como sucesso;
  # falha ou cancelamento de qualquer job, não. Sem isto, `needs.ci.result` dependeria de como
  # o GitHub resume jobs pulados dentro de um workflow reutilizável.
  resultado:
    name: Resultado do CI
    runs-on: ubuntu-24.04
    needs: [mudancas, backend, frontend-admin, frontend-site, e2e]
    if: always()
    steps:
      - name: Conferir
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          case " $RESULTADOS " in
            *' failure '*|*' cancelled '*) exit 1 ;;
          esac
