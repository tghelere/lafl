name: lar-analia-franco

services:
  app:
    build:
      context: ./docker/php
    volumes:
      - ./backend:/var/www/html
    ports:
      - "${APP_FORWARD_PORT:-8000}:8000"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - MAIL_HOST=mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lar

  # Fila e agendador rodam em processo PRÓPRIO, como em qualquer servidor — o `app` acima
  # atende requisição e mais nada. Sem estes dois containers, nada disparado por fila ou por
  # agendamento acontece no ambiente local: notificação por e-mail dos formulários
  # (Mail::queue em App\Actions\Forms\NotifyFormSubmissionReceived), expurgo por `expires_at`
  # e expurgo de endereço de coleta concluída (App\Jobs\..., agendados em
  # backend/routes/console.php) simplesmente ficam parados, e o defeito só apareceria em
  # produção. Os dois reaproveitam a mesma imagem e o mesmo volume do `app`: divergir a
  # imagem do worker da imagem da aplicação é como um job passa a falhar só em produção.
  queue:
    build:
      context: ./docker/php
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - MAIL_HOST=mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - lar

  # `schedule:work` é o equivalente local do cron de minuto em minuto que o servidor usa: ele
  # fica no ar e chama `schedule:run` a cada minuto. Os jobs agendados são despachados para a
  # fila, então este container sozinho não basta — quem executa é o `queue` acima.
  scheduler:
    build:
      context: ./docker/php
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - MAIL_HOST=mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - lar

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DB_DATABASE:-lar_analia_franco}
      - POSTGRES_USER=${DB_USERNAME:-lar}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-lar}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Banco de teste dedicado (lar_analia_franco_test), separado do banco de
      # desenvolvimento — ver docker/postgres/init-test-db.sql e backend/.env.testing. Só
      # roda no primeiro boot do container (volume vazio); num volume já existente, criar o
      # banco manualmente (ver README).
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
      # Terceiro banco (lar_analia_franco_e2e), o da bateria de ponta a ponta — ver
      # docker/postgres/init-e2e-db.sql. Mesma ressalva do anterior: só no primeiro boot;
      # num volume já existente, `php artisan e2e:prepare` cria o banco sozinho.
      - ./docker/postgres/init-e2e-db.sql:/docker-entrypoint-initdb.d/init-e2e-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lar

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - lar

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    networks:
      - lar

networks:
  lar:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
