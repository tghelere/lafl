<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Ícones do PAINEL, declarados um a um e com versão. O painel e o site são origens
      diferentes (painel.<domínio> e <domínio>), cada uma com os próprios arquivos em
      public/ — mas o navegador guarda favicon em cache por muito tempo, por URL, e a aba
      continuava mostrando o ícone antigo mesmo com o servidor já entregando o certo. O
      ?v=2 muda a URL e fura esse cache; ao trocar os arquivos de novo, suba o número aqui,
      em public/manifest.webmanifest e no e2e (identidade-da-aba.spec.ts).
      .ico primeiro, para navegador antigo que ignora o SVG; SVG depois, que é o que o
      navegador atual escolhe por ser o último que ele entende.
    -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico?v=2" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=2" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=2" />
    <meta name="theme-color" content="#221f1b" />

    <!--
      Título de partida, antes do Vue montar. A partir daí quem escreve document.title é o
      afterEach do roteador, no formato "<Tela> · Painel LAF" — ver src/router/index.ts.
    -->
    <title>Painel LAF</title>

    <!--
      Configuração em tempo de execução, fora do bundle e reescrita no servidor a cada
      publicação (ver public/config.js e src/config.ts). No <head> e clássico (sem
      type="module") de propósito: o bundle lê window.__LAF_CONFIG__ na avaliação do
      módulo, e o Vite move o <script type="module"> para o <head> no build — deixar isto
      no <body> passaria a depender da ordem "módulo é adiado, clássico não", que é
      verdadeira mas é o tipo de coisa que quebra em silêncio numa mudança de bundler.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Algumas extensões de navegador (bloqueadores de rastreamento, "anti-fingerprint")
      // fazem window.localStorage LANÇAR exceção em vez de simplesmente não existir. Libs
      // como @vue/devtools-kit (dependência transitiva do Pinia) só tratam o caso
      // "localStorage === undefined", não o caso "acessar localStorage lança erro" — isso
      // derruba a avaliação do módulo antes do Vue montar, deixando a tela em branco.
      // Shim silencioso em memória cobre esse caso sem mudar nada para o usuário comum.
      try {
        window.localStorage.getItem('__lar_analia_franco_storage_probe__')
      } catch {
        const memory = new Map()
        Object.defineProperty(window, 'localStorage', {
          configurable: true,
          value: {
            getItem: (key) => (memory.has(key) ? memory.get(key) : null),
            setItem: (key, value) => memory.set(key, String(value)),
            removeItem: (key) => memory.delete(key),
            clear: () => memory.clear(),
            key: (index) => Array.from(memory.keys())[index] ?? null,
            get length() {
              return memory.size
            },
          },
        })
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
