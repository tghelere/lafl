# API (Laravel/PHP-FPM) — __AMBIENTE__
#
# Gerado por infra/criar-ambiente.sh a partir deste modelo. Edite AQUI, não em
# /etc/nginx/sites-available.

server {
    listen 80;
    listen [::]:80;
    server_name __HOST_API__;

    include snippets/laf-acme.conf;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HOST_API__;

    ssl_certificate     /etc/letsencrypt/live/__HOST_API__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST_API__/privkey.pem;
    include snippets/laf-tls.conf;

    include snippets/laf-comum.conf;

    # `current` é um link simbólico trocado a cada publicação. `$realpath_root` em vez de
    # `$document_root` no SCRIPT_FILENAME: sem isso o PHP-FPM continua servindo o caminho
    # resolvido no start e o opcache guarda o arquivo da release ANTERIOR — o deploy
    # "funciona" e o código velho continua no ar até alguém reiniciar o FPM.
    root /var/www/laf/__AMBIENTE__/current/backend/public;
    index index.php;

    access_log /var/log/nginx/laf-__AMBIENTE__-api.access.log;
    error_log  /var/log/nginx/laf-__AMBIENTE__-api.error.log;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Nada abaixo de public/ que não seja arquivo existente chega ao PHP a não ser pelo
    # index.php — a regra abaixo é o que impede `/uploads/x.php` de ser executado se um dia
    # alguém servir arquivo enviado por aqui.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/laf-__AMBIENTE__.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
