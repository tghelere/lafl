# Site público (Nuxt/Nitro) — __AMBIENTE__
#
# Gerado por infra/criar-ambiente.sh a partir deste modelo. Editar o arquivo em
# /etc/nginx/sites-available não adianta: rodar o script de novo sobrescreve. Edite AQUI.

server {
    listen 80;
    listen [::]:80;
    server_name __HOST_SITE__;

    include snippets/laf-acme.conf;

    location / { return 301 https://$host$request_uri; }
}

server {
    __ESCUTA_443__
    server_name __HOST_SITE__;

    ssl_certificate     /etc/letsencrypt/live/__HOST_SITE__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST_SITE__/privkey.pem;
    include snippets/laf-tls.conf;

    include snippets/laf-comum.conf;

    access_log /var/log/nginx/laf-__AMBIENTE__-site.access.log;
    error_log  /var/log/nginx/laf-__AMBIENTE__-site.error.log;

    # Autenticação básica — SÓ no site de homologação, e só metade da proteção. A outra
    # metade é o `X-Robots-Tag: noindex, nofollow` que o próprio Nitro emite quando
    # NUXT_PUBLIC_ENVIRONMENT=staging (ver frontend-site/server/plugins/staging-noindex.ts).
    # As duas juntas, nunca uma só: a autenticação impede a leitura, o cabeçalho impede a
    # indexação de qualquer coisa que escape dela.
    #
    # Não existe equivalente na API nem no painel, de propósito: a API é consumida pelo
    # painel por XHR e uma senha de nginx quebraria toda requisição; o painel já exige
    # login de verdade.
__AUTH_BASICA__

    location / {
        proxy_pass http://127.0.0.1:__PORTA_SITE__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
