; Pool do PHP-FPM — __AMBIENTE__
;
; Gerado por infra/criar-ambiente.sh. Um pool por ambiente, com socket próprio: staging e
; production não compartilham processo, nem opcache, nem limite de memória. Ver
; docs/deploy.md §2 — nada é compartilhado entre os dois além do sistema operacional.

[laf-__AMBIENTE__]
user  = deploy
group = www-data

listen       = /run/php/laf-__AMBIENTE__.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = __FPM_MAX_CHILDREN__
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests      = 500

; Sem isto, $_ENV/getenv() do PHP-FPM ficam vazios e o Laravel não enxerga nada do ambiente
; do sistema. O .env do ambiente é lido pelo próprio Laravel, não daqui — esta linha existe
; só para o PATH continuar sendo o do sistema.
env[PATH] = /usr/local/bin:/usr/bin:/bin

php_admin_value[error_log] = /var/log/php/laf-__AMBIENTE__.error.log
php_admin_flag[log_errors] = on

; APP_DEBUG=false no .env já impede o traceback de sair na resposta; isto impede que ele
; saia mesmo num erro fatal que aconteça ANTES de o Laravel subir.
php_admin_flag[display_errors] = off
