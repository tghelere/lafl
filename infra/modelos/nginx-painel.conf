# Painel administrativo (SPA Vite, arquivos estáticos) — __AMBIENTE__
#
# Gerado por infra/criar-ambiente.sh a partir deste modelo. Edite AQUI, não em
# /etc/nginx/sites-available.

server {
    listen 80;
    listen [::]:80;
    server_name __HOST_PAINEL__;

    include snippets/laf-acme.conf;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HOST_PAINEL__;

    ssl_certificate     /etc/letsencrypt/live/__HOST_PAINEL__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST_PAINEL__/privkey.pem;
    include snippets/laf-tls.conf;

    include snippets/laf-comum.conf;

    root /var/www/laf/__AMBIENTE__/current/painel;
    index index.html;

    access_log /var/log/nginx/laf-__AMBIENTE__-painel.access.log;
    error_log  /var/log/nginx/laf-__AMBIENTE__-painel.error.log;

    # O painel fica fora da busca em qualquer ambiente — não é conteúdo público.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # SPA: qualquer rota que não seja arquivo existente devolve o index.html. Sem isto,
    # recarregar a página em /admin/usuarios dá 404 (ver docs/deploy.md §3).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `expires`, e não `add_header Cache-Control`, de propósito: no nginx um add_header
    # dentro de um bloco DESCARTA todos os herdados do bloco de cima em vez de somar — a
    # rota perderia X-Robots-Tag, HSTS e os três cabeçalhos de laf-comum.conf de uma vez.
    # `expires` é diretiva própria e não mexe em nada disso.

    # Nome com hash: o conteúdo nunca muda para o mesmo nome.
    location /assets/ {
        expires 1y;
    }

    # Sem hash no nome e reescritos a cada publicação (config.js com a configuração do
    # ambiente, ver docs/decisoes/0015-painel-configurado-em-tempo-de-execucao.md).
    # Cacheados, o navegador continuaria apontando para a API do ambiente anterior.
    # `expires -1` = Cache-Control: no-cache, isto é, revalida sempre.
    location = /config.js {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }
}
